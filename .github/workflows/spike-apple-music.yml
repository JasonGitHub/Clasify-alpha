name: Spike Apple Music
# SPIKE ONLY (draft PR, never merge). Builds AppleMusicSpike.dmg for Jason's Mac.
# Runs only on a push to the spike branch or by hand, never on pull_request,
# so no fork code ever runs with the signing secrets.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-p662uo]
    paths: ['Spikes/AppleMusic/**', '.github/workflows/spike-apple-music.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dmg:
    runs-on: macos-15
    # Jason adds MACOS_CERT_P12 and MACOS_CERT_PASSWORD to this environment, limited to the spike branch.
    # With no secrets the app is ad-hoc signed: B and C still work, A (MusicKit) does not.
    environment: apple-music-spike
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: xcodebuild -version
      - name: Build (Release, universal)
        working-directory: Spikes/AppleMusic
        run: |
          swift build -c release --arch arm64 --arch x86_64
          echo "BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_ENV"
      - name: Make the app bundle
        working-directory: Spikes/AppleMusic
        run: |
          app=build/AppleMusicSpike.app
          mkdir -p "$app/Contents/MacOS"
          cp "$BIN/AppleMusicSpike" "$app/Contents/MacOS/"
          sed "s/BUILD_NUMBER/${{ github.run_number }}/" Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          lipo -info "$app/Contents/MacOS/AppleMusicSpike"
      - name: Sign (Developer ID if the secrets exist, else ad-hoc)
        working-directory: Spikes/AppleMusic
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          app=build/AppleMusicSpike.app
          if [ -n "$CERT_P12" ]; then
            keychain="$RUNNER_TEMP/spike.keychain-db"
            kc_pass="$(uuidgen)"
            security create-keychain -p "$kc_pass" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$kc_pass" "$keychain"
            printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
            if [ -z "$identity" ]; then echo "No Developer ID Application identity in the .p12."; exit 1; fi
            echo "Signing with: $identity"
            codesign --force --timestamp --sign "$identity" "$app"
            echo "SIGNED=developer-id" >> "$GITHUB_ENV"
          else
            echo "::warning::No MACOS_CERT_P12 secret. Ad-hoc signing: path A (MusicKit) will not work."
            codesign --force --sign - "$app"
            echo "SIGNED=ad-hoc" >> "$GITHUB_ENV"
          fi
          codesign --verify --verbose "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Identifier|TeamIdentifier|Authority' || true
      - name: Make the DMG
        working-directory: Spikes/AppleMusic
        run: |
          mkdir dmg && cp -R build/AppleMusicSpike.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Apple Music Spike" -srcfolder dmg -ov -format UDZO AppleMusicSpike.dmg
      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/spike.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: AppleMusicSpike-${{ github.run_number }}-${{ env.SIGNED }}.dmg
          path: Spikes/AppleMusic/AppleMusicSpike.dmg
          retention-days: 14
