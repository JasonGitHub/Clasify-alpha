name: iPhone TestFlight
# CLA-202: archive the iPhone test app (PhoneSpike/, scheme "PhoneSpike") on main, sign it in the
# cloud with the App Store Connect API key (Admin role), and upload it to TestFlight.
# Started by hand only, on main only. It is the only job here that uses environment "release".
# The build can go to external testers: Jason adds it to the group "Testers" and sends it to
# beta review by hand. The job does neither.
# Never add `set -x` here, and never print a secret.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  testflight:
    # Any other branch or tag is refused: the job does not start, so it never gets the secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26  # TestFlight uploads need Xcode 26 and the iOS 26 SDK.
    timeout-minutes: 45
    environment: release
    env:
      # The paths are under $RUNNER_TEMP; the runner context is not available at job level.
      KEY_FILE: asc/AuthKey.p8
      ARCHIVE: PhoneSpike.xcarchive
      BUILD_NUMBER: ${{ github.run_number }}
      TEAM_ID: 6GDHV9227A
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - run: xcodebuild -version
      - name: Write the API key to a temporary file that only this user can read
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::ASC_KEY_P8, ASC_KEY_ID or ASC_ISSUER_ID is not set in environment release."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/$KEY_FILE"
      - name: Archive for iOS, signed in the cloud
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive -project PhoneSpike/PhoneSpike.xcodeproj -scheme PhoneSpike \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/$KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # No testFlightInternalTestingOnly: the build must be usable by external testers.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/$KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. Apple processes it before it shows in TestFlight."
      - name: Delete the API key file and the downloaded profiles
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"
