name: iPhone TestFlight
# CLA-202: archive the iPhone app (ClasifyPhone/, scheme "myPod iPhone" in Clasify.xcodeproj) on
# main, sign it in the cloud with the App Store Connect API key (Admin role) at export, and upload
# it to TestFlight. The test app PhoneSpike/ is no longer uploaded.
# Started by hand only, on main only. It is the only job here that uses environment "release".
# The build can go to external testers: Jason adds it to the group "External" and sends it to
# beta review by hand. The job does neither.
# Never add `set -x` here, and never print a secret.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  testflight:
    # Any other branch or tag is refused: the job does not start, so it never gets the secrets.
    if: github.ref == 'refs/heads/main'
    # The Xcode 27 image (macOS 27, Xcode 27.1 default) builds with the iOS 27 SDK, which App Store
    # Connect asks for from April 2027 (notice ITMS-90725). It has no macos-27 label.
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    env:
      # The paths are under $RUNNER_TEMP; the runner context is not available at job level.
      KEY_FILE: asc/AuthKey.p8
      ARCHIVE: myPod.xcarchive
      BUILD_NUMBER: ${{ github.run_number }}
      # TestFlight already has version 0.1 (builds 1 and 2, the test app). The target says 1.0;
      # the uploads stay on 0.1 until Jason picks the release version.
      APP_VERSION: "0.1"
      TEAM_ID: 6GDHV9227A
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - run: xcodebuild -version
      - name: Write the API key to a temporary file that only this user can read
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::ASC_KEY_P8, ASC_KEY_ID or ASC_ISSUER_ID is not set in environment release."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/$KEY_FILE"
      - name: Archive for iOS, not signed
        # Signing at archive time needs a development profile, and the team has no registered
        # device (run 46104020623). The export step below signs for distribution in the cloud.
        # The app has no entitlements file, so the unsigned archive loses nothing.
        # The scheme archives the Release configuration, which also makes the dSYM.
        run: |
          xcodebuild archive -project Clasify.xcodeproj -scheme "myPod iPhone" \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$APP_VERSION"
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # No testFlightInternalTestingOnly: the build must be usable by external testers.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/$KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded version $APP_VERSION build $BUILD_NUMBER. Apple processes it before it shows in TestFlight."
      - name: Delete the API key file and the downloaded profiles
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"
