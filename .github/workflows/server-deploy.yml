# Deploys the activation server (server/) to Cloudflare. Only a hand-started run on main does it
# (Jason decided 2026-11-18 23:23 JST). Merging this file deploys nothing.
# The GitHub environment "server" holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; Jason adds them.
# Never print a secret, and never add set -x here (CLA-69).
name: Server deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: server
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with: { node-version: "22" }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # wrangler comes from package-lock.json and reads the two secrets from the environment.
      - name: Apply the D1 migrations
        run: npx wrangler d1 migrations apply mypod-activation --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
