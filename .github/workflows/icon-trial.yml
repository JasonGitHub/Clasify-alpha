name: Icon trial
# CLA-179, TEMPORARY: a trial of the Icon Composer app icon (Clasify/AppIcon.icon), built with
# Xcode 26, to test whether Control Center then shows the myPod badge in Now Playing. It runs
# only on a push to the side branch claude/icon-trial (Jason's OK, 2026-11-24 22:03 JST). It uses
# no environment and no secret: the DMG is ad-hoc signed. Nothing from this branch merges to main.
on:
  push:
    branches: [claude/icon-trial]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    runs-on: macos-15
    permissions:
      contents: read
    env:
      DMG: myPod-icon-trial-${{ github.run_number }}.dmg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Select the newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Cache the Rust build of the bridge
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            LibrespotBridge/target
          key: bridge-${{ runner.os }}-${{ hashFiles('LibrespotBridge/Cargo.lock') }}
      - name: Build the universal bridge library
        run: scripts/build-bridge.sh
      - name: Build the app (Release, universal), warnings listed but not errors
        run: |
          set -o pipefail
          # The build number 9000 + run tells the trial apart from build 458 in About.
          xcodebuild build -project Clasify.xcodeproj -scheme Clasify -configuration Release \
            CURRENT_PROJECT_VERSION=$(( 9000 + ${{ github.run_number }} )) \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            -destination 'generic/platform=macOS' -derivedDataPath DerivedData 2>&1 | tee build.log
          echo "Warnings in our code with Xcode 26:"
          grep -E '/Clasify[^ ]*\.swift:[0-9]+:[0-9]+: warning: ' build.log | sort -u || echo "(none)"
      - name: Show the app icon in the bundle
        run: |
          app=DerivedData/Build/Products/Release/myPod.app
          res="$app/Contents/Resources"
          # The old look for standard controls, so the icon is the only change in this trial.
          /usr/libexec/PlistBuddy -c "Add :UIDesignRequiresCompatibility bool true" "$app/Contents/Info.plist"
          for key in CFBundleVersion CFBundleIconFile CFBundleIconName UIDesignRequiresCompatibility; do
            echo "$key = $(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist" 2>&1)"
          done
          ls -la "$res"
          if [ -f "$res/AppIcon.icns" ]; then
            echo "AppIcon.icns: in the bundle"
            iconutil -c iconset "$res/AppIcon.icns" -o "$RUNNER_TEMP/AppIcon.iconset" && ls "$RUNNER_TEMP/AppIcon.iconset"
          else
            echo "AppIcon.icns: NOT in the bundle"
          fi
          xcrun assetutil --info "$res/Assets.car" > "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" <<'PY'
          import json, sys
          for e in json.load(open(sys.argv[1])):
              if "AppIcon" in str(e.get("Name", "")) or e.get("AssetType") in ("Icon Image", "MultiSized Image", "IconStack", "Icon"):
                  print({k: e.get(k) for k in ("Name", "AssetType", "RenditionName", "PixelWidth", "PixelHeight", "Scale", "Idiom", "Appearance")})
          PY
      - name: Ad-hoc sign and make the DMG
        run: |
          app=DerivedData/Build/Products/Release/myPod.app
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          mkdir dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          size=$(( $(du -sm dmg | cut -f1) + 50 ))
          for try in 1 2; do
            rm -f "$DMG"
            if hdiutil create -volname myPod -srcfolder dmg -size "${size}m" -ov -format UDZO "$DMG"; then break; fi
            if [ "$try" = 2 ]; then echo "hdiutil create failed twice" >&2; exit 1; fi
            sleep 10
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          retention-days: 3
