name: Phone
# CLA-202: build for the iOS Simulator, unsigned: the test app (PhoneSpike/, both schemes), the
# iPhone app (ClasifyPhone/, scheme "myPod iPhone" in Clasify.xcodeproj) and the skins package (ClasifySkins/).
# No secrets, no environment. macos-26 because uploads to TestFlight need Xcode 26.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["PhoneSpike/**", "ClasifyPhone/**", "Clasify.xcodeproj/**", "ClasifyCore/**", "ClasifyAppleMusic/**", "ClasifyShell/**", "ClasifySkins/**", ".github/workflows/phone.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - run: xcodebuild -version
      - name: Build both schemes for the iOS Simulator, unsigned
        run: |
          set -o pipefail
          for scheme in "PhoneSpike" "PhoneSpike NoBG"; do
            xcodebuild build -project PhoneSpike/PhoneSpike.xcodeproj -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a build.log
          done
      - name: Build the iPhone app (scheme "myPod iPhone", with ClasifyShell) for the iOS Simulator, unsigned
        run: |
          set -o pipefail
          xcodebuild build -project Clasify.xcodeproj -scheme "myPod iPhone" \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/PhoneData" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a build.log
      - name: Build the skins package for the iOS Simulator, unsigned
        working-directory: ClasifySkins
        run: |
          set -o pipefail
          xcodebuild build -scheme ClasifySkins -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SkinsData" CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a ../build.log
      - name: List the warnings
        if: always()
        run: |
          grep -E '(^|: )warning: ' build.log | sort -u || echo "No warnings."
