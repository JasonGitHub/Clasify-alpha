name: App DMG
# Builds the test DMG of the app from main (CLA-69). Not part of PR CI.
# - A push to main that changes the app makes an ad-hoc signed DMG. That job uses no secret.
# - A run started by hand on main makes a DMG signed with Developer ID and notarized. Only that
#   job uses environment "release" and its secrets. Started with beta = true, it also uploads the DMG
#   to the public beta downloads (Cloudflare R2, dl.getmypod.app, CLA-96). Neither job ever runs on a PR.
on:
  workflow_dispatch:
    inputs:
      beta:
        description: "Also put this signed build on the public beta downloads (Cloudflare R2, dl.getmypod.app, CLA-96)"
        type: boolean
        default: false
  push:
    branches: [main]
    # Only a merge that can change the app makes a new test DMG. Workflow and doc changes do not.
    paths: ["ClasifyCore/**", "ClasifySkins/**", "Clasify/**", "Clasify.xcodeproj/**", "LibrespotBridge/**", "scripts/**", ".github/actions/build-app/**"]
concurrency:
  # A push does not cancel a signed run started by hand.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dmg:
    if: github.event_name == 'push'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      DMG: myPod-build-${{ github.run_number }}.dmg  # the build number Jason sees
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Cache the Rust build of the bridge
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            LibrespotBridge/target
          key: bridge-${{ runner.os }}-${{ hashFiles('LibrespotBridge/Cargo.lock') }}
      - uses: ./.github/actions/build-app
      - name: Ad-hoc sign and make the DMG
        run: |
          app=DerivedData/Build/Products/Release/myPod.app
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          mkdir dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          # hdiutil's own size estimate for -srcfolder can be too small ("No space left on
          # device"). Give the size: the folder plus 50 MB. Try at most twice.
          size=$(( $(du -sm dmg | cut -f1) + 50 ))
          for try in 1 2; do
            rm -f "$DMG"
            if hdiutil create -volname myPod -srcfolder dmg -size "${size}m" -ov -format UDZO "$DMG"; then break; fi
            if [ "$try" = 2 ]; then echo "hdiutil create failed twice" >&2; exit 1; fi
            sleep 10
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          retention-days: 14

  signed-dmg:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    env:
      IDENTITY: "Developer ID Application: CAPPYAI LIMITED (6GDHV9227A)"  # not a secret
      DMG: myPod-build-${{ github.run_number }}-signed.dmg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: ./.github/actions/build-app  # no cache in the signing job
      - name: Import the Developer ID certificate into a keychain for this run
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -base64 24)
          echo "::add-mask::$kcpw"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
      - name: Put the PostHog project key into the app, before signing
        # CLA-97: the beta events' key (a public write key). An empty or unset secret writes an
        # empty value: the app then sends nothing. The value goes as one argument, never echoed.
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          plutil -replace PostHogKey -string "$POSTHOG_KEY" DerivedData/Build/Products/Release/myPod.app/Contents/Info.plist
      - name: Sign the app with hardened runtime and make the DMG
        run: |
          app=DerivedData/Build/Products/Release/myPod.app
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
          mkdir dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          # hdiutil's own size estimate for -srcfolder can be too small ("No space left on
          # device"). Give the size: the folder plus 50 MB. Try at most twice.
          size=$(( $(du -sm dmg | cut -f1) + 50 ))
          for try in 1 2; do
            rm -f "$DMG"
            if hdiutil create -volname myPod -srcfolder dmg -size "${size}m" -ov -format UDZO "$DMG"; then break; fi
            if [ "$try" = 2 ]; then echo "hdiutil create failed twice" >&2; exit 1; fi
            sleep 10
          done
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
      - name: Notarize and staple the DMG
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY" > "$key"
          status=0
          xcrun notarytool submit "$DMG" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > notary.json || status=$?
          rm -f "$key"
          cat notary.json
          if [ "$status" -ne 0 ] || ! grep -q '"status" *: *"Accepted"' notary.json; then
            echo "Notarization was not accepted."
            exit 1
          fi
          # The ticket can take a moment to appear, and Apple's server can drop the connection.
          for try in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG"; then break; fi
            if [ "$try" -eq 5 ]; then echo "Stapling failed 5 times."; exit 1; fi
            echo "Stapling failed (try $try of 5). Trying again in 20 s."
            sleep 20
          done
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          retention-days: 14
      - name: Upload the DMG and latest.json to the beta downloads (Cloudflare R2)
        # Only a run started with beta = true. Every other step is the same for both values.
        # After the artifact upload, so a failed upload never costs the signed DMG artifact.
        if: inputs.beta
        # CLA-96, CLA-125: R2 bucket mypod-downloads, public at https://dl.getmypod.app. The DMG
        # gets a new path per build, beta/myPod-beta-<n>.dmg. beta/latest.json has a fixed path
        # and is overwritten, with a 60 s cache, so the app's launch check and the beta page see
        # a new build within about a minute. The app reads only "build" (a JSON number).
        # The keys reach the aws CLI (already on the runner) only through its environment
        # variables, never on a command line. Never add set -x or print a key (CLA-69).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not take the newer default checksums of aws CLI 2.23 and later.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2: https://caa0581308cde970492fe61266cc1180.r2.cloudflarestorage.com  # S3 endpoint, not a secret
          BUCKET: mypod-downloads
          PUBLIC: https://dl.getmypod.app
          BETA: myPod-beta-${{ github.run_number }}.dmg
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2_ACCESS_KEY_ID or R2_SECRET_ACCESS_KEY is not set in environment release. The DMG was not uploaded."
            exit 1
          fi
          aws --version
          put() {  # put <file> <key> <content type> [cache-control]
            aws s3 cp "$1" "s3://$BUCKET/$2" --endpoint-url "$R2" --no-progress --only-show-errors \
              --content-type "$3" ${4:+--cache-control "$4"}
          }
          put "$DMG" "beta/$BETA" application/x-apple-diskimage
          url="$PUBLIC/beta/$BETA"
          echo "DMG: $url"
          jq -n --argjson build "$BUILD" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg file "$BETA" --arg url "$url" \
            '{build: $build, date: $date, file: $file, url: $url}' > latest.json
          cat latest.json
          put latest.json beta/latest.json application/json "max-age=60"
          echo "latest.json: $PUBLIC/beta/latest.json"
          rm -f latest.json
