[package]
name = "librespot-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "C FFI over librespot for the Clasify macOS app"

[lib]
crate-type = ["staticlib", "rlib"]

# librespot is pinned to one exact version. tokio is already a librespot
# dependency; we name it only to create the runtime that librespot needs.
[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "=0.8.0", default-features = false }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Already a librespot dependency. Named only to forward librespot's messages to the app as events.
log = "0.4"
# Already a librespot dependency. Named only to decode the rootlist protobuf.
protobuf = "3.7"
# Already a librespot dependency. Named only for http::Method in the spike Connect call.
http = "=1.5.0"
# Part of librespot (pinned like the others). Named only for the spike's Connect cluster protobufs.
librespot-protocol = "=0.8.0"
# Already a librespot dependency. Named only to read the dealer connection ID stream in the spike.
futures-util = { version = "=0.3.34", default-features = false }
